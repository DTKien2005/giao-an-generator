name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suite (offline mock provider)
        run: python -m pytest tests/ -q
      - name: Run evaluation set
        run: |
          python scripts/make_dataset.py || true
          python scripts/make_eval.py || true
          python -m app.ingest
          python -m app.evaluate
        env:
          DEFAULT_PROVIDER: mock
